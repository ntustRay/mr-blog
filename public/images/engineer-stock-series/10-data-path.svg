<text x="947" y="440.0" text-anchor="middle" fill="#c6d0cb" font-size="14">固定版本</text>
<path d="M780 593H717" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="748.5" y="579" text-anchor="middle" fill="#c6d0cb" font-size="14">驗證結果</text>
<path d="M410 593H347" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="378.5" y="579" text-anchor="middle" fill="#c6d0cb" font-size="14">回應</text>
<rect x="40" y="190" width="300" height="185" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="58" y="219" fill="#657a70" font-size="14">OFFICIAL / 原始資料</text>
<text x="58" y="259" fill="#f0f3ef" font-size="23" font-weight="700">TWSE / TPEx / TDCC</text>
<text x="58" y="295" fill="#c6d0cb" font-size="17">GET 官方 JSON</text>
<text x="58" y="323" fill="#c6d0cb" font-size="17">各自的日期、欄位與單位</text>
<rect x="410" y="190" width="300" height="185" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="428" y="219" fill="#f4cd55" font-size="14">engineer-stock-data</text>
<text x="428" y="259" fill="#f0f3ef" font-size="23" font-weight="700">Actions 執行資料程式</text>
<text x="428" y="295" fill="#c6d0cb" font-size="17">registry → fetch → provider</text>
<text x="428" y="323" fill="#c6d0cb" font-size="17">檢查結構、日期與資料範圍</text>
<rect x="780" y="190" width="300" height="185" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
<text x="798" y="219" fill="#91c5a5" font-size="14">VERIFY + PUBLISH</text>
<text x="798" y="259" fill="#f0f3ef" font-size="23" font-weight="700">GitHub / data branch</text>
<text x="798" y="295" fill="#c6d0cb" font-size="17">manifest、索引與個股 JSON</text>
<text x="798" y="323" fill="#c6d0cb" font-size="17">整批驗證後切換 SHA</text>
<rect x="40" y="505" width="300" height="185" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="58" y="534" fill="#657a70" font-size="14">BROWSER</text>
<text x="58" y="574" fill="#f0f3ef" font-size="23" font-weight="700">使用者畫面</text>
<text x="58" y="610" fill="#c6d0cb" font-size="17">清單、個股、圖表</text>
<text x="58" y="638" fill="#c6d0cb" font-size="17">顯示日期與資料狀態</text>
<rect x="410" y="505" width="300" height="185" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="428" y="534" fill="#f4cd55" font-size="14">engineer-stock-web</text>
<text x="428" y="574" fill="#f0f3ef" font-size="23" font-weight="700">Next.js Server</text>
