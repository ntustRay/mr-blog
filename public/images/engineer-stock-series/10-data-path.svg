<rect x="780" y="505" width="300" height="185" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="798" y="534" fill="#657a70" font-size="14">PINNED READ</text>
<text x="798" y="574" fill="#f0f3ef" font-size="23" font-weight="700">固定 commit SHA 讀取</text>
<text x="798" y="610" fill="#c6d0cb" font-size="17">驗證 hash 與 schema</text>
<text x="798" y="638" fill="#c6d0cb" font-size="17">公開資料可共用快取</text>
<text x="40" y="743" fill="#c6d0cb" font-size="18">流程示意｜官方 API 回原始資料；Next.js 自己的 API 回正規化資料與 meta。</text>
<text x="40" y="772" fill="#c6d0cb" font-size="18">資料更新不必讓每一位使用者重新抓一次全市場。</text>
