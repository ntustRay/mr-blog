<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
  <title id="title">先對齊官方日期，再驗證與發布</title>
  <desc id="desc">兩市場日期不同時隔三十秒重試，最多兩次。一致後依自動或手動模式決定日期，驗證日曆、新鮮度與快照。通過才更新 data，失敗保留原 SHA。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#a6b6b0"/></marker>
  </defs>
  <rect width="1120" height="1040" fill="#101718"/>
  <g font-family="Noto Sans CJK TC, Noto Sans TC, Arial, sans-serif">
    <text x="50" y="47" fill="#f4cd55" font-size="18" letter-spacing="2">ENGINEER STOCK / 11 — DEBUG</text>
    <text x="50" y="100" fill="#f0f3ef" font-size="32" font-weight="700">先對齊官方日期，再驗證與發布</text>
    <g stroke="#a6b6b0" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M365 245V290"/>
      <path d="M680 340H820"/>
      <path d="M950 290V195H680"/>
      <path d="M950 395V655"/>
      <path d="M365 395V470"/>
      <path d="M680 530H750V720H820"/>
      <path d="M365 590V655"/>
      <path d="M680 710H820"/>
      <path d="M365 765V840"/>
      <path d="M680 895H950V785"/>
    </g>
    <g fill="#c6d0cb" font-size="18">
      <text x="732" y="325">不同</text>
      <text x="392" y="440">一致</text>
      <text x="968" y="568">仍不同</text>
      <text x="699" y="513">不通過</text>
      <text x="392" y="631">通過</text>
      <text x="702" y="696">失敗</text>
      <text x="392" y="812">通過</text>
      <text x="708" y="882">lease 衝突</text>
    </g>
    <rect x="50" y="145" width="630" height="100" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
    <text x="75" y="184" fill="#f0f3ef" font-size="25" font-weight="700">讀 TWSE / TPEx 行情</text>
    <text x="75" y="219" fill="#c6d0cb" font-size="20">先驗證結構，再解析各市場的 quoteDate</text>
    <rect x="50" y="290" width="630" height="105" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
    <text x="75" y="332" fill="#f0f3ef" font-size="25" font-weight="700">兩市場日期相同？</text>
    <text x="75" y="369" fill="#c6d0cb" font-size="20">不同日期不能併成同一份當日快照</text>
    <rect x="820" y="290" width="260" height="105" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
    <text x="840" y="331" fill="#f0f3ef" font-size="23" font-weight="700">相隔 30 秒重抓</text>
    <text x="840" y="368" fill="#c6d0cb" font-size="20">最多重試 2 次</text>
    <rect x="50" y="470" width="630" height="120" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
    <text x="75" y="508" fill="#f0f3ef" font-size="25" font-weight="700">決定 targetDate，檢查可接受範圍</text>
    <text x="75" y="543" fill="#c6d0cb" font-size="20">自動：用 quoteDate；手動：使用指定日期</text>
    <text x="75" y="572" fill="#c6d0cb" font-size="20">日曆、未來、新鮮度、來源日期完全相符</text>
    <rect x="50" y="655" width="630" height="110" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
    <text x="75" y="697" fill="#f0f3ef" font-size="25" font-weight="700">依 targetDate 組裝與驗證快照</text>
    <text x="75" y="735" fill="#c6d0cb" font-size="20">公司上市日、完整性、資料日期不得倒退</text>
    <rect x="820" y="655" width="260" height="130" fill="#1b2525" stroke="#dc9a80" stroke-width="1.5"/>
    <text x="840" y="707" fill="#f0f3ef" font-size="25" font-weight="700">停止發布</text>
    <text x="840" y="749" fill="#dc9a80" font-size="23">保留前版 SHA</text>
    <rect x="50" y="840" width="630" height="110" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
    <text x="75" y="882" fill="#f0f3ef" font-size="25" font-weight="700">通過後更新 data SHA</text>
    <text x="75" y="920" fill="#c6d0cb" font-size="20">root commit + force-with-lease 原子替換</text>
    <text x="50" y="1002" fill="#a6b6b0" font-size="20">now 限制日期範圍；quoteDate 決定自動模式的資料日。</text>
  </g>
</svg>
