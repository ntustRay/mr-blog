<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 675" role="img" aria-labelledby="title desc">
<title id="title">資料發布成功，還要核對日期</title>
<desc id="desc">內容相同或非交易日可以略過；Workflow success 不等於資料日期已前進。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#a6b6b0"/></marker></defs>
<rect width="1120" height="675" fill="#101718"/>
<g font-family="Noto Sans CJK TC, Noto Sans TC, Arial, sans-serif">
<text x="40" y="48" fill="#f4cd55" font-size="18" letter-spacing="2">ENGINEER STOCK / 03</text>
<text x="40" y="101" fill="#f0f3ef" font-size="32" font-weight="700">資料發布成功，還要核對日期</text>
<path d="M340 243H405" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<path d="M710 243H775" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="742.5" y="230" text-anchor="middle" fill="#c6d0cb" font-size="15">通過</text>
<path d="M560 320V371H190V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="375.0" y="361" text-anchor="middle" fill="#c6d0cb" font-size="15">失敗</text>
<path d="M930 320V382H190V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="560.0" y="372" text-anchor="middle" fill="#c6d0cb" font-size="15">失敗</text>
<path d="M930 320V382H560V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="745.0" y="372" text-anchor="middle" fill="#c6d0cb" font-size="15">通過</text>
<path d="M710 503H775" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="165" width="300" height="155" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="59" y="193" fill="#657a70" font-size="14">TRIGGER</text>
<text x="59" y="232" fill="#f0f3ef" font-size="23" font-weight="700">排程／手動／push</text>
<text x="59" y="267" fill="#c6d0cb" font-size="17">main branch 的 Workflow</text>
<rect x="410" y="165" width="300" height="155" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="429" y="193" fill="#f4cd55" font-size="14">CI</text>
<text x="429" y="232" fill="#f0f3ef" font-size="23" font-weight="700">validate job</text>
<text x="429" y="267" fill="#c6d0cb" font-size="17">Biome、TypeScript、unit tests</text>
<rect x="780" y="165" width="300" height="155" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="799" y="193" fill="#657a70" font-size="14">COLLECT</text>
<text x="799" y="232" fill="#f0f3ef" font-size="23" font-weight="700">publish job</text>
<text x="799" y="267" fill="#c6d0cb" font-size="17">抓來源、檢查日期與快照</text>
<rect x="40" y="425" width="300" height="155" fill="#1b2525" stroke="#dc9a80" stroke-width="1.5"/>
<text x="59" y="453" fill="#dc9a80" font-size="14">FAILURE</text>
<text x="59" y="492" fill="#f0f3ef" font-size="23" font-weight="700">保留前版 SHA</text>
<text x="59" y="527" fill="#c6d0cb" font-size="17">必要來源或驗證失敗</text>
<rect x="410" y="425" width="300" height="155" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
<text x="429" y="453" fill="#91c5a5" font-size="14">GIT</text>
<text x="429" y="492" fill="#f0f3ef" font-size="23" font-weight="700">更新 data branch</text>
<text x="429" y="527" fill="#c6d0cb" font-size="17">root commit + lease 檢查</text>
<rect x="780" y="425" width="300" height="155" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="799" y="453" fill="#657a70" font-size="14">WEB</text>
<text x="799" y="492" fill="#f0f3ef" font-size="23" font-weight="700">網站重新解析 SHA</text>
<text x="799" y="527" fill="#c6d0cb" font-size="17">使用快照與資料日期</text>
<text x="40" y="626" fill="#a6b6b0" font-size="17">內容相同或非交易日可以略過；Workflow success 不等於資料日期已前進。</text>
