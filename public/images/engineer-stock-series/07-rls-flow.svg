<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 675" role="img" aria-labelledby="title desc">
<title id="title">登入限制與資料列權限都要驗證</title>
<desc id="desc">Server 的篩選與 RLS 一起使用；不能靠隱藏 UI 按鈕來保護資料。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#a6b6b0"/></marker></defs>
<rect width="1120" height="675" fill="#101718"/>
<g font-family="Noto Sans CJK TC, Noto Sans TC, Arial, sans-serif">
<text x="40" y="48" fill="#f4cd55" font-size="18" letter-spacing="2">ENGINEER STOCK / 07</text>
<text x="40" y="101" fill="#f0f3ef" font-size="32" font-weight="700">登入限制與資料列權限都要驗證</text>
<path d="M340 243H405" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<path d="M710 243H775" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="742.5" y="230" text-anchor="middle" fill="#c6d0cb" font-size="15">已登入</text>
<path d="M560 320V371H190V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="375.0" y="361" text-anchor="middle" fill="#c6d0cb" font-size="15">無 session</text>
<path d="M930 320V382H560V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="745.0" y="372" text-anchor="middle" fill="#c6d0cb" font-size="15">所有者</text>
<path d="M930 320V420" fill="none" stroke="#a6b6b0" stroke-width="2" marker-end="url(#a)"/>
<text x="946" y="372.5" text-anchor="middle" fill="#c6d0cb" font-size="15">非所有者</text>
<rect x="40" y="165" width="300" height="155" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="59" y="193" fill="#657a70" font-size="14">REQUEST</text>
<text x="59" y="232" fill="#f0f3ef" font-size="23" font-weight="700">追蹤清單 API</text>
<text x="59" y="267" fill="#c6d0cb" font-size="17">body 僅接受 market、symbol</text>
<rect x="410" y="165" width="300" height="155" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="429" y="193" fill="#f4cd55" font-size="14">SERVER</text>
<text x="429" y="232" fill="#f0f3ef" font-size="23" font-weight="700">getUser</text>
<text x="429" y="267" fill="#c6d0cb" font-size="17">由目前 session 取得 user.id</text>
<rect x="780" y="165" width="300" height="155" fill="#1b2525" stroke="#657a70" stroke-width="1.5"/>
<text x="799" y="193" fill="#657a70" font-size="14">DATABASE</text>
<text x="799" y="232" fill="#f0f3ef" font-size="23" font-weight="700">RLS policies</text>
<text x="799" y="267" fill="#c6d0cb" font-size="17">auth.uid() = user_id</text>
<rect x="40" y="425" width="300" height="155" fill="#1b2525" stroke="#dc9a80" stroke-width="1.5"/>
<text x="59" y="453" fill="#dc9a80" font-size="14">NO SESSION</text>
<text x="59" y="492" fill="#f0f3ef" font-size="23" font-weight="700">401</text>
<text x="59" y="527" fill="#c6d0cb" font-size="17">未登入不得操作會員資料</text>
<rect x="410" y="425" width="300" height="155" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
<text x="429" y="453" fill="#91c5a5" font-size="14">OWNER</text>
<text x="429" y="492" fill="#f0f3ef" font-size="23" font-weight="700">自己的資料列</text>
<text x="429" y="527" fill="#c6d0cb" font-size="17">允許所屬資料的讀寫</text>
<rect x="780" y="425" width="300" height="155" fill="#1b2525" stroke="#dc9a80" stroke-width="1.5"/>
<text x="799" y="453" fill="#dc9a80" font-size="14">OTHER MEMBER</text>
<text x="799" y="492" fill="#f0f3ef" font-size="23" font-weight="700">其他會員資料列</text>
<text x="799" y="527" fill="#c6d0cb" font-size="17">讀寫受限；測試需分別檢查</text>
<text x="40" y="626" fill="#a6b6b0" font-size="17">Server 的篩選與 RLS 一起使用；不能靠隱藏 UI 按鈕來保護資料。</text>
</g></svg>