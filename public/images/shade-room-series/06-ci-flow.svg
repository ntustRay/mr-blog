<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc"><title id="title">乾淨 checkout 後，要補回哪些東西？</title><desc id="desc">資產準備 → 計算驗證 → 瀏覽器驗證；報告另外保存。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5cb"/></marker></defs><rect width="1000" height="950" fill="#10141c"/><g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><text x="32" y="49" fill="#f4d34f" font-size="30" text-anchor="start">乾淨 checkout 後，要補回哪些東西？</text><text x="32" y="90" fill="#b6c1d2" font-size="21" text-anchor="start">資產準備 → 計算驗證 → 瀏覽器驗證；報告另外保存。</text><g><rect x="65" y="145" width="540" height="145" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="65" y="145" width="5" height="145" fill="#f4d34f"/><text x="85" y="182" fill="#f4d34f" font-size="26" text-anchor="start">1 / 相依套件與資產</text><text x="85" y="220" fill="#e4e7ef" font-size="22" text-anchor="start">frozen lockfile → assets</text><text x="85" y="251" fill="#e4e7ef" font-size="22" text-anchor="start">Google 模型 + 同版本 npm WASM</text></g><g><rect x="65" y="390" width="540" height="145" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="65" y="390" width="5" height="145" fill="#f4d34f"/><text x="85" y="427" fill="#f4d34f" font-size="26" text-anchor="start">2 / Unit → Production build</text><text x="85" y="465" fill="#e4e7ef" font-size="22" text-anchor="start">純函式計算</text><text x="85" y="496" fill="#e4e7ef" font-size="22" text-anchor="start">型別檢查與靜態輸出</text></g><g><rect x="65" y="635" width="540" height="145" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="65" y="635" width="5" height="145" fill="#f4d34f"/><text x="85" y="672" fill="#f4d34f" font-size="26" text-anchor="start">3 / Chromium → E2E</text><text x="85" y="710" fill="#e4e7ef" font-size="22" text-anchor="start">安裝瀏覽器與系統相依</text><text x="85" y="741" fill="#e4e7ef" font-size="22" text-anchor="start">真實模型 / 像素 / 模擬串流</text></g><g><rect x="700" y="390" width="268" height="200" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="700" y="390" width="5" height="200" fill="#8fd4de"/><text x="720" y="427" fill="#8fd4de" font-size="26" text-anchor="start">保存報告</text><text x="720" y="465" fill="#e4e7ef" font-size="22" text-anchor="start">if: always()</text><text x="720" y="496" fill="#e4e7ef" font-size="22" text-anchor="start">上傳可用結果</text><text x="720" y="527" fill="#e4e7ef" font-size="22" text-anchor="start">保留 7 天</text></g><path d="M335 290 V390" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 535 V635" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 462 H700" fill="none" stroke="#a8b5cb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M605 710 H835 V590" fill="none" stroke="#a8b5cb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="65" y="857" fill="#b6c1d2" font-size="22" text-anchor="start">E2E 目前使用 dev server；部署產物與正式網址另做 smoke test。</text><text x="32" y="926" fill="#8997ad" font-size="17" text-anchor="start">SHADE ROOM / ENGINEERING NOTES / 2026-11-02</text></g></svg>