<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-labelledby="title desc"><title id="title">相機推論排程：忙碌時，跳過這一幀</title><desc id="desc">送出最多一份工作；回傳後檢查來源版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5cb"/></marker></defs><rect width="1000" height="990" fill="#10141c"/><g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><text x="32" y="49" fill="#f4d34f" font-size="30" text-anchor="start">相機推論排程：忙碌時，跳過這一幀</text><text x="32" y="90" fill="#b6c1d2" font-size="21" text-anchor="start">送出最多一份工作；回傳後檢查來源版本。</text><g><rect x="32" y="150" width="265" height="150" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="32" y="150" width="5" height="150" fill="#f4d34f"/><text x="52" y="187" fill="#f4d34f" font-size="26" text-anchor="start">新的 rAF</text><text x="52" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">video 有新影格</text><text x="52" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">距上次 &gt; 42 ms</text></g><g><rect x="365" y="150" width="270" height="150" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="365" y="150" width="5" height="150" fill="#f4d34f"/><text x="385" y="187" fill="#f4d34f" font-size="26" text-anchor="start">Worker 可用？</text><text x="385" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">已 ready</text><text x="385" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">busy === false</text></g><g><rect x="710" y="150" width="258" height="150" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="710" y="150" width="5" height="150" fill="#8fd4de"/><text x="730" y="187" fill="#8fd4de" font-size="26" text-anchor="start">忙碌 / 未就緒</text><text x="730" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">跳過本次推論</text><text x="730" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">不累積影格</text></g><g><rect x="365" y="410" width="270" height="155" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="365" y="410" width="5" height="155" fill="#f4d34f"/><text x="385" y="447" fill="#f4d34f" font-size="26" text-anchor="start">建立並傳送</text><text x="385" y="485" fill="#e4e7ef" font-size="22" text-anchor="start">Bitmap + sourceKey</text><text x="385" y="516" fill="#e4e7ef" font-size="22" text-anchor="start">Worker → landmarks</text></g><g><rect x="365" y="665" width="270" height="125" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="365" y="665" width="5" height="125" fill="#f4d34f"/><text x="385" y="702" fill="#f4d34f" font-size="26" text-anchor="start">解除 busy</text><text x="385" y="740" fill="#e4e7ef" font-size="22" text-anchor="start">比對 sourceKey</text></g><g><rect x="32" y="835" width="265" height="105" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="32" y="835" width="5" height="105" fill="#f4d34f"/><text x="52" y="872" fill="#f4d34f" font-size="26" text-anchor="start">有效：更新</text><text x="52" y="910" fill="#e4e7ef" font-size="22" text-anchor="start">平滑座標並重畫</text></g><g><rect x="710" y="835" width="258" height="105" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="710" y="835" width="5" height="105" fill="#8fd4de"/><text x="730" y="872" fill="#8fd4de" font-size="26" text-anchor="start">過期：丟棄</text><text x="730" y="910" fill="#e4e7ef" font-size="22" text-anchor="start">不套用舊定位</text></g><path d="M297 225 H365" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 225 H710" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 300 V410" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="522" y="360" fill="#b6c1d2" font-size="22" text-anchor="start">可用</text><path d="M500 565 V665" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M365 729 H164 V835" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="201" y="715" fill="#b6c1d2" font-size="20" text-anchor="start">相同版本</text><path d="M635 729 H839 V835" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="694" y="715" fill="#b6c1d2" font-size="20" text-anchor="start">舊版本</text><text x="32" y="966" fill="#8997ad" font-size="17" text-anchor="start">SHADE ROOM / ENGINEERING NOTES / 2026-11-02</text></g></svg>