<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">比較與下載，需要不同的尺寸觀念</title><desc id="desc">比較先換到影像比例；匯出直接讀取繪圖緩衝區。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5cb"/></marker></defs><rect width="1000" height="1000" fill="#10141c"/><g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><text x="32" y="49" fill="#f4d34f" font-size="30" text-anchor="start">比較與下載，需要不同的尺寸觀念</text><text x="32" y="90" fill="#b6c1d2" font-size="21" text-anchor="start">比較先換到影像比例；匯出直接讀取繪圖緩衝區。</text><rect x="90" y="160" width="800" height="230" fill="#191f2b" stroke="#67758e" stroke-width="2"/><rect x="250" y="200" width="600" height="150" fill="#26392f" stroke="#8fd4de" stroke-width="2"/><path d="M490 145 V405" stroke="#f4d34f" stroke-width="4"/><text x="95" y="144" fill="#b6c1d2" font-size="23" text-anchor="start">viewport width = 800</text><text x="265" y="285" fill="#8fd4de" font-size="25" text-anchor="start">paintedWidth = 600</text><text x="95" y="435" fill="#b6c1d2" font-size="23" text-anchor="start">left = 160</text><text x="510" y="435" fill="#f4d34f" font-size="23" text-anchor="start">slider x = 0.5 × 800 = 400</text><g><rect x="90" y="485" width="800" height="115" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="90" y="485" width="5" height="115" fill="#f4d34f"/><text x="110" y="522" fill="#f4d34f" font-size="26" text-anchor="start">傳給 Shader 的比例</text><text x="110" y="560" fill="#e4e7ef" font-size="22" text-anchor="start">(400 - 160) / 600 = 0.4，再限制到 0～1</text></g><text x="32" y="680" fill="#f4d34f" font-size="27" text-anchor="start">匯出順序</text><g><rect x="32" y="730" width="265" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="32" y="730" width="5" height="140" fill="#f4d34f"/><text x="52" y="767" fill="#f4d34f" font-size="26" text-anchor="start">停用比較裁切</text><text x="52" y="805" fill="#e4e7ef" font-size="22" text-anchor="start">compare: null</text><text x="52" y="836" fill="#e4e7ef" font-size="22" text-anchor="start">重畫當前設定</text></g><g><rect x="367" y="730" width="265" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="367" y="730" width="5" height="140" fill="#f4d34f"/><text x="387" y="767" fill="#f4d34f" font-size="26" text-anchor="start">建立快照</text><text x="387" y="805" fill="#e4e7ef" font-size="22" text-anchor="start">width / height</text><text x="387" y="836" fill="#e4e7ef" font-size="22" text-anchor="start">drawImage(canvas)</text></g><g><rect x="702" y="730" width="266" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="702" y="730" width="5" height="140" fill="#f4d34f"/><text x="722" y="767" fill="#f4d34f" font-size="26" text-anchor="start">輸出 PNG</text><text x="722" y="805" fill="#e4e7ef" font-size="22" text-anchor="start">toBlob()</text><text x="722" y="836" fill="#e4e7ef" font-size="22" text-anchor="start">釋放 Object URL</text></g><path d="M297 800 H367" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M632 800 H702" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="934" fill="#b6c1d2" font-size="22" text-anchor="start">CSS zoom / pan 改變檢視；下載尺寸仍依處理後的 Canvas。</text><text x="32" y="976" fill="#8997ad" font-size="17" text-anchor="start">SHADE ROOM / ENGINEERING NOTES / 2026-11-02</text></g></svg>