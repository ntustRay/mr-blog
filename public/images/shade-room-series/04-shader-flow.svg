<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc"><title id="title">一個輸出像素，會讀取哪些資料？</title><desc id="desc">兩張 Texture + 一組 Uniform；遮罩外保留原圖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5cb"/></marker></defs><rect width="1000" height="840" fill="#10141c"/><g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><text x="32" y="49" fill="#f4d34f" font-size="30" text-anchor="start">一個輸出像素，會讀取哪些資料？</text><text x="32" y="90" fill="#b6c1d2" font-size="21" text-anchor="start">兩張 Texture + 一組 Uniform；遮罩外保留原圖。</text><g><rect x="32" y="150" width="265" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="32" y="150" width="5" height="140" fill="#f4d34f"/><text x="52" y="187" fill="#f4d34f" font-size="26" text-anchor="start">Texture 0</text><text x="52" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">原圖</text><text x="52" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">u_source</text></g><g><rect x="367" y="150" width="265" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="367" y="150" width="5" height="140" fill="#f4d34f"/><text x="387" y="187" fill="#f4d34f" font-size="26" text-anchor="start">Texture 1</text><text x="387" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">唇部灰階遮罩</text><text x="387" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">u_mask</text></g><g><rect x="702" y="150" width="266" height="140" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="702" y="150" width="5" height="140" fill="#f4d34f"/><text x="722" y="187" fill="#f4d34f" font-size="26" text-anchor="start">Uniform</text><text x="722" y="225" fill="#e4e7ef" font-size="22" text-anchor="start">色彩 / 濃度</text><text x="722" y="256" fill="#e4e7ef" font-size="22" text-anchor="start">質地 / 比較</text></g><g><rect x="245" y="430" width="510" height="150" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="245" y="430" width="5" height="150" fill="#f4d34f"/><text x="265" y="467" fill="#f4d34f" font-size="26" text-anchor="start">Fragment Shader</text><text x="265" y="505" fill="#e4e7ef" font-size="22" text-anchor="start">取樣 → 亮度與混色</text><text x="265" y="536" fill="#e4e7ef" font-size="22" text-anchor="start">mask × strength × coverage</text></g><g><rect x="245" y="685" width="510" height="100" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="245" y="685" width="5" height="100" fill="#f4d34f"/><text x="265" y="722" fill="#f4d34f" font-size="26" text-anchor="start">Canvas 的輸出像素</text><text x="265" y="760" fill="#e4e7ef" font-size="22" text-anchor="start">保留原圖 / 合成妝效</text></g><path d="M164 290 V350 H350 V430" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 290 V430" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M835 290 V350 H650 V430" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 580 V685" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="125" fill="#b6c1d2" font-size="18" text-anchor="start">兩個三角形覆蓋 Canvas，UV 對應 Texture 取樣位置。</text><text x="32" y="816" fill="#8997ad" font-size="17" text-anchor="start">SHADE ROOM / ENGINEERING NOTES / 2026-11-02</text></g></svg>