<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc"><title id="title">來源切換：完成後，再問一次是否有效</title><desc id="desc">generation 跟著來源遞增；舊工作完成也不能覆蓋新來源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5cb"/></marker></defs><rect width="1000" height="930" fill="#10141c"/><g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><text x="32" y="49" fill="#f4d34f" font-size="30" text-anchor="start">來源切換：完成後，再問一次是否有效</text><text x="32" y="90" fill="#b6c1d2" font-size="21" text-anchor="start">generation 跟著來源遞增；舊工作完成也不能覆蓋新來源。</text><g><rect x="245" y="140" width="510" height="115" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="245" y="140" width="5" height="115" fill="#f4d34f"/><text x="265" y="177" fill="#f4d34f" font-size="26" text-anchor="start">開始新來源</text><text x="265" y="215" fill="#e4e7ef" font-size="22" text-anchor="start">sourceKey = ++generation</text></g><g><rect x="245" y="325" width="510" height="115" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="245" y="325" width="5" height="115" fill="#f4d34f"/><text x="265" y="362" fill="#f4d34f" font-size="26" text-anchor="start">等待非同步工作</text><text x="265" y="400" fill="#e4e7ef" font-size="22" text-anchor="start">解碼照片 / 等待推論回應</text></g><g><rect x="245" y="510" width="510" height="115" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="245" y="510" width="5" height="115" fill="#f4d34f"/><text x="265" y="547" fill="#f4d34f" font-size="26" text-anchor="start">版本仍相同嗎？</text><text x="265" y="585" fill="#e4e7ef" font-size="22" text-anchor="start">sourceKey === generation</text></g><g><rect x="32" y="735" width="425" height="130" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="32" y="735" width="5" height="130" fill="#8fd4de"/><text x="52" y="772" fill="#8fd4de" font-size="26" text-anchor="start">過期：丟棄</text><text x="52" y="810" fill="#e4e7ef" font-size="22" text-anchor="start">關閉尚未接管的 Bitmap</text><text x="52" y="841" fill="#e4e7ef" font-size="22" text-anchor="start">保留目前來源</text></g><g><rect x="543" y="735" width="425" height="130" fill="#191f2b" stroke="#485267" stroke-width="2"/><rect x="543" y="735" width="5" height="130" fill="#f4d34f"/><text x="563" y="772" fill="#f4d34f" font-size="26" text-anchor="start">有效：接管</text><text x="563" y="810" fill="#e4e7ef" font-size="22" text-anchor="start">替換舊影像與資源</text><text x="563" y="841" fill="#e4e7ef" font-size="22" text-anchor="start">更新畫面與狀態</text></g><path d="M500 255 V325" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 440 V510" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 625 V680 H244 V735" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="287" y="670" fill="#b6c1d2" font-size="24" text-anchor="start">否</text><path d="M630 625 V680 H755 V735" fill="none" stroke="#a8b5cb" stroke-width="3" marker-end="url(#arrow)"/><text x="678" y="670" fill="#b6c1d2" font-size="24" text-anchor="start">是</text><text x="32" y="906" fill="#8997ad" font-size="17" text-anchor="start">SHADE ROOM / ENGINEERING NOTES / 2026-11-02</text></g></svg>