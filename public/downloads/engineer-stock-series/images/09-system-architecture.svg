<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">兩種資料，兩條更新路徑</title>
<desc id="desc">公開股票由批次 Pipeline 發布到 GitHub；Next.js 以固定 SHA 讀取。瀏覽器與 Next Server 互動，會員由 Supabase Auth 驗證並以 PostgreSQL RLS 限制資料列。圖中為實作架構示意。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#81998d"/></marker></defs>
<rect width="1200" height="1010" fill="#101718"/>
<g font-family="Noto Sans CJK TC, Noto Sans TC, Arial, sans-serif">
<text x="40" y="45" fill="#f4cd55" font-size="18" text-anchor="start" font-weight="400">ENGINEER STOCK / 09</text>
<text x="40" y="97" fill="#f0f3ef" font-size="32" text-anchor="start" font-weight="700">兩種資料，兩條更新路徑</text>
<text x="40" y="139" fill="#c6d0cb" font-size="20" text-anchor="start" font-weight="400">公開資料先整理；私人資料按會員操作寫入。網站程式與股票資料分開發布。</text>
<text x="40" y="189" fill="#f4cd55" font-size="17" text-anchor="start" font-weight="400">PUBLIC / 批次更新</text>
<rect x="40" y="215" width="280" height="145" fill="#1b2525" stroke="#81998d" stroke-width="1.5"/>
<text x="60" y="244" fill="#81998d" font-size="15" text-anchor="start" font-weight="400">SOURCE</text>
<text x="60" y="280" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">官方股票來源</text>
<text x="60" y="314" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">行情、營收、財報等</text>
<text x="60" y="342" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">格式與日期可能不同</text>
<rect x="380" y="215" width="340" height="145" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="400" y="244" fill="#f4cd55" font-size="15" text-anchor="start" font-weight="400">engineer-stock-data</text>
<text x="400" y="280" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">Bun / TypeScript</text>
<text x="400" y="314" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">收集 → 正規化 → 驗證</text>
<text x="400" y="342" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">Actions 排程與發布</text>
<rect x="780" y="215" width="380" height="145" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
<text x="800" y="244" fill="#91c5a5" font-size="15" text-anchor="start" font-weight="400">GitHub / data branch</text>
<text x="800" y="280" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">JSON 快照</text>
<text x="800" y="314" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">manifest、索引、個股與序列</text>
<text x="800" y="342" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">SHA 固定版本；hash 驗內容</text>
<path d="M320 285H374" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720 285H774" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970 360V450" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="988" y="410" fill="#c6d0cb" font-size="17" text-anchor="start" font-weight="400">固定 SHA 讀取</text>
<rect x="40" y="455" width="280" height="205" fill="#1b2525" stroke="#81998d" stroke-width="1.5"/>
<text x="60" y="484" fill="#81998d" font-size="15" text-anchor="start" font-weight="400">BROWSER</text>
<text x="60" y="520" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">使用者畫面</text>
<text x="60" y="554" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">URL / GET forms</text>
<text x="60" y="582" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">圖表 local state</text>
<text x="60" y="610" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">Cookie / member forms</text>
<rect x="430" y="455" width="730" height="205" fill="#1b2525" stroke="#f4cd55" stroke-width="1.5"/>
<text x="450" y="484" fill="#f4cd55" font-size="15" text-anchor="start" font-weight="400">engineer-stock-web / Node.js / Vercel</text>
<text x="450" y="520" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">Next.js App Router</text>
<text x="450" y="554" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">Server Components：讀取、查詢、組頁與 metadata</text>
<text x="450" y="582" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">Route Handlers：HTTP JSON；Server Actions：會員 mutation</text>
<text x="450" y="610" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">公開快照快取與會員資料讀寫分開</text>
<path d="M320 517H424" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="375" y="499" fill="#c6d0cb" font-size="16" text-anchor="middle" font-weight="400">請求</text>
<path d="M430 610H326" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="375" y="641" fill="#c6d0cb" font-size="15" text-anchor="middle" font-weight="400">HTML / JSON</text>
<text x="430" y="716" fill="#f4cd55" font-size="17" text-anchor="start" font-weight="400">MEMBER / 即時讀寫</text>
<rect x="430" y="770" width="325" height="145" fill="#1b2525" stroke="#81998d" stroke-width="1.5"/>
<text x="450" y="799" fill="#81998d" font-size="15" text-anchor="start" font-weight="400">SUPABASE AUTH</text>
<text x="450" y="835" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">身分與 session</text>
<text x="450" y="869" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">getClaims / getUser</text>
<text x="450" y="897" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">callback 交換 session</text>
<rect x="815" y="770" width="345" height="145" fill="#1b2525" stroke="#91c5a5" stroke-width="1.5"/>
<text x="835" y="799" fill="#91c5a5" font-size="15" text-anchor="start" font-weight="400">SUPABASE POSTGRES</text>
<text x="835" y="835" fill="#f0f3ef" font-size="24" text-anchor="start" font-weight="700">會員資料與權限</text>
<text x="835" y="869" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">profiles / watchlists / 偏好</text>
<text x="835" y="897" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">RLS、唯一約束、外鍵</text>
<path d="M590 660V764" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M985 660V764" fill="none" stroke="#81998d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="966" fill="#c6d0cb" font-size="18" text-anchor="start" font-weight="400">示意圖｜GitHub 不保存會員資料；資料快照更新通常不必重新部署 Next.js 網站。</text>
</g></svg>